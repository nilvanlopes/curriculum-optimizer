services:
  optimizer:
    build:
      context: .
      target: runtime
    image: curriculum-optimizer:local
    init: true
    read_only: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output:rw
      - ./data:/app/data:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://local.curriculum-optimizer}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-curriculum-optimizer}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-lm-studio}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
