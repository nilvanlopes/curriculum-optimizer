<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[NOME] - [CARGO]</title>
  <style>
    @page { size: A4; margin: 12mm; }
    * { box-sizing: border-box; }
    body { max-width: 210mm; margin: 0 auto; color: #172033; font: 12px/1.4 Arial, sans-serif; }
    .header { border-bottom: 2px solid #1f4e79; padding-bottom: 10px; }
    .header h1 { margin: 0; font-size: 28px; }
    .title { color: #1f4e79; font-size: 16px; font-weight: 700; }
    .contact-info { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 6px; }
    .summary { margin: 12px 0; }
    .section { margin-top: 14px; }
    .section-title { border-bottom: 1px solid #9aa8b5; color: #1f4e79; font-size: 16px; margin: 0 0 8px; }
    .experience-item { margin-bottom: 11px; }
    .experience-header { display: flex; justify-content: space-between; gap: 10px; }
    .job-title { font-size: 14px; margin: 0; }
    .company-name { font-weight: 700; }
    .achievements { margin: 5px 0; padding-left: 20px; }
    .tech-stack { display: flex; flex-wrap: wrap; gap: 4px; }
    .tech-tag { background: #edf2f7; border-radius: 3px; padding: 2px 5px; }
    .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 16px; }
    .skill-category-title { font-weight: 700; }
    a { color: inherit; }
  </style>
</head>
<body class="template-tech-lead" data-template="neutral-v1">
  <header class="header">
    <h1>[NOME]</h1>
    <div class="title">[CARGO]</div>
    <div class="contact-info"><!-- Somente contatos presentes na fonte --></div>
  </header>

  <section class="summary" data-customizable="summary">[RESUMO FACTUAL]</section>

  <section class="section experiences">
    <h2 class="section-title">Experiência Profissional</h2>
    <article class="experience-item" data-company="[slug-unico]" data-keywords="[keywords-da-fonte]" data-relevance="high">
      <div class="experience-header">
        <h3 class="job-title">[CARGO OU PROJETO]</h3>
        <span class="period">[PERÍODO EXATO DA FONTE]</span>
      </div>
      <div class="company-name">[EMPRESA OU CONTEXTO]</div>
      <ul class="achievements">
        <li class="achievement" data-category="[categoria]" data-impact="high" data-keywords="[keywords-da-fonte]" data-metrics="false">[REALIZAÇÃO DA FONTE]</li>
      </ul>
      <div class="tech-stack"><span class="tech-tag">[TECNOLOGIA DA FONTE]</span></div>
    </article>
  </section>

  <section class="section skills">
    <h2 class="section-title">Competências Técnicas</h2>
    <div class="skills-grid">
      <div class="skill-category" data-category="[slug-categoria]">
        <div class="skill-category-title">[CATEGORIA]</div>
        <div class="skill-list">[COMPETÊNCIAS DA FONTE]</div>
      </div>
    </div>
  </section>

  <!-- Incluir education, certifications e languages apenas quando existirem na fonte. -->
</body>
</html>
